<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova Store – Admin</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='13' fill='%236d3df5'/%3E%3Cpath d='M24 9c1.2 7.6 7.4 13.8 15 15-7.6 1.2-13.8 7.4-15 15-1.2-7.6-7.4-13.8-15-15 7.6-1.2 13.8-7.4 15-15z' fill='white'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ===== Basic setup ===== */
:root{--accent:#6d3df5;--accent-soft:#f1ecff;--text:#1d1b20;--muted:#5f6368;--line:#e6e4ec;--soft:#f6f5fa;--red:#d93025}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Roboto,system-ui,sans-serif;color:var(--text);background:var(--soft);line-height:1.5;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:var(--accent)}
.hidden{display:none!important}
.muted{color:var(--muted);font-size:14px}
.err{color:var(--red);font-size:14px}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}

/* ===== Header ===== */
header{background:#fff;border-bottom:1px solid var(--line)}
.head-in{max-width:900px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:Poppins,sans-serif;font-size:19px;font-weight:600;flex:1}
.brand b{color:var(--accent)}
.brand small{font-family:Roboto,sans-serif;font-size:12px;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:6px;font-weight:500}
.logo{width:34px;height:34px}

/* ===== Cards, inputs, buttons ===== */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card h2{font-size:18px;font-weight:500}
label{display:block;font-size:13px;font-weight:500;color:#3c4043;margin-bottom:12px}
label small{font-weight:400;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input:not([type]),select,textarea{display:block;width:100%;margin-top:5px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=file]{display:block;margin-top:6px;font-size:13px}
textarea{resize:vertical}
label.check{display:flex;align-items:center;gap:8px;font-weight:400}
.grid2{display:grid;grid-template-columns:1fr;gap:0 16px}
@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.btn{background:var(--accent);color:#fff;font-weight:500;padding:11px 22px;border-radius:10px;font-size:15px}
.btn:hover{background:#5a2be0}
.btn-ghost{border:1px solid var(--line);padding:8px 14px;border-radius:10px;font-size:14px;color:var(--accent);background:#fff}
.inline{display:flex;gap:10px;align-items:flex-end}
.inline label{flex:1;margin-bottom:0}
.ok{color:#188038;font-size:13px;margin-top:8px}
.uid{font-family:monospace;font-size:13px;background:var(--soft);padding:2px 6px;border-radius:6px;word-break:break-all}
.prev{width:72px;height:72px;border-radius:16px;margin-top:8px;object-fit:cover;border:1px solid var(--line)}
.shot-prev{display:flex;gap:8px;overflow-x:auto;margin-top:8px}
.shot-prev img{height:110px;border-radius:8px;border:1px solid var(--line)}

/* ===== Apps list ===== */
.row{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0}
.row img{width:56px;height:56px;border-radius:14px;object-fit:cover;background:var(--soft)}
.row-info{flex:1;min-width:160px}
.row-info b{display:block;font-weight:500}
.row-info span{font-size:13px;color:var(--muted)}
.badge{font-style:normal;font-size:11px;background:var(--accent-soft);color:var(--accent);padding:1px 8px;border-radius:6px;margin-right:6px}
.badge.gray{background:#eee;color:#555}
.row-btns{display:flex;gap:6px;flex-wrap:wrap}
.row-btns button{border:1px solid var(--line);padding:6px 12px;border-radius:8px;font-size:13px;background:#fff}
.row-btns button:hover{background:var(--soft)}
.danger{color:var(--red)!important}

/* ===== Login ===== */
.login{max-width:380px;margin:60px auto}

/* ===== Busy overlay + modal ===== */
.overlay{position:fixed;inset:0;background:rgba(15,10,30,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.busy-box{background:#fff;border-radius:16px;padding:26px;max-width:380px;width:100%;text-align:center}
.spin{width:40px;height:40px;border:3px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.modal-box{background:#fff;border-radius:16px;padding:20px;max-width:560px;width:100%;max-height:85vh;overflow:auto}
.rv-row{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.rv-row p{color:#3c4043;white-space:pre-line}
.rv-row button{border:1px solid var(--line);padding:5px 10px;border-radius:8px;font-size:13px;flex-shrink:0}
.stars{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#2b2733;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:120;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<!-- Header -->
<header><div class="head-in">
  <div class="brand">
    <svg class="logo" viewBox="0 0 48 48"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9b6bff"/><stop offset="1" stop-color="#5a2be0"/></linearGradient></defs><rect width="48" height="48" rx="13" fill="url(#lg)"/><path d="M24 9c1.2 7.6 7.4 13.8 15 15-7.6 1.2-13.8 7.4-15 15-1.2-7.6-7.4-13.8-15-15 7.6-1.2 13.8-7.4 15-15z" fill="#fff"/></svg>

<!-- Admin panel -->
<div id="panel" class="wrap hidden">

  <!-- Setup: GitHub token + UID -->
  <div class="card">
    <div class="card-head"><h2>Setup</h2></div>
    <div class="inline">
      <label>GitHub token <small>(saved only in this browser)</small><input type="password" id="tokenInput" placeholder="github_pat_..." autocomplete="off"></label>

      <label>Category
        <select id="fCategory">
          <option>Games</option><option>Tools</option><option>Entertainment</option><option>Education</option>
          <option>Lifestyle</option><option>Productivity</option><option>Social</option><option>Photography</option><option>Other</option>
        </select></label>
      <label>Version *<input id="fVersion" placeholder="1.0.0" required></label>
      <label>Developer<input id="fDeveloper" value="USA Developers"></label>

<!-- Upload ke waqt busy screen -->
<div id="busy" class="overlay hidden"><div class="busy-box"><div class="spin"></div><p id="busyText">Working…</p><p class="muted" style="margin-top:6px">Don't close this tab.</p></div></div>

<!-- Reviews manage karne ka popup -->
<div id="rvModal" class="overlay hidden"><div class="modal-box">
  <div class="card-head"><h2 id="rvTitle">Reviews</h2><button class="btn-ghost" id="rvClose" type="button">Close</button></div>
  <div id="rvList"></div>
</div></div>

<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs, query, where, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const TAG = "NovaAdmin";
const OWNER = "GeniusArif15";
const REPO = "novastore";
const BRANCH = "main";
const API = `https://api.github.com/repos/${OWNER}/${REPO}`;
const RAW = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/`;
const STORE_URL = "https://geniusarif15.github.io/novastore/";
const MAX_APK = 95 * 1024 * 1024;

const firebaseConfig = {
  apiKey: "AIzaSyAxqEYyoepmVwfXy6lAQpvwODeEyg62BXU",
  authDomain: "nova-store-27d05.firebaseapp.com",
  projectId: "nova-store-27d05",
  storageBucket: "nova-store-27d05.firebasestorage.app",
  messagingSenderId: "54040497928",
  appId: "1:54040497928:web:e8af1c3469c4a2dd90a6bd"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

const $ = (s) => document.querySelector(s);
let remote = { apps: [], exists: false };
let editingId = null;
let busy = false;

// Text ko HTML mein safe banata hai
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Bytes ko MB / KB mein badalta hai
function fmtSize(b) {
  if (!b) return "–";
  if (b >= 1048576) return (b / 1048576).toFixed(1) + " MB";
  return Math.max(1, Math.round(b / 1024)) + " KB";
}

// localStorage se value parhta hai
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

// localStorage mein value save karta hai
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { console.warn(TAG, "Storage blocked"); } }

// Neeche chhota message dikhata hai
function toast(msg, ms = 3000) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), ms);
  console.log(TAG, "Toast:", msg);
}

// Busy screen dikhata hai
function setBusy(text) {
  busy = true;
  $("#busy").classList.remove("hidden");
  $("#busyText").textContent = text;
  console.log(TAG, "Busy:", text);
}

// Busy screen band karta hai
function doneBusy() {
  busy = false;
  $("#busy").classList.add("hidden");
  console.log(TAG, "Busy done");
}

// GitHub file ka direct link banata hai (admin preview ke liye)
function rawUrl(path) { return path ? RAW + path : ""; }

// Saved GitHub token deta hai
function getToken() { return lsGet("nova_gh_token") || ""; }

// GitHub API ko request bhejta hai
async function gh(path, opts = {}) {
  const token = getToken();
  if (!token) throw new Error("GitHub token missing – save it in Setup first");
  const headers = { Authorization: "Bearer " + token, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
  if (opts.body) headers["Content-Type"] = "application/json";
  const res = await fetch(API + path, { ...opts, headers, cache: "no-store" });
  if (!res.ok) {
    let msg = String(res.status);
    try { const j = await res.json(); msg += " " + (j.message || ""); } catch (e) { /* ignore */ }
    console.error(TAG, "GitHub error:", path, msg);
    const err = new Error("GitHub: " + msg);
    err.status = res.status;
    throw err;
  }
  return res.status === 204 ? null : res.json();
}

// Bytes ko base64 text mein badalta hai
function bytesToBase64(bytes) {
  let bin = "";
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  return btoa(bin);
}

// Normal text ko base64 mein badalta hai
function utf8ToBase64(str) { return bytesToBase64(new TextEncoder().encode(str)); }

// base64 ko wapas normal text banata hai
function base64ToUtf8(b64) {
  const bin = atob(b64.replace(/\s/g, ""));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

// File (APK) ko base64 mein badalta hai
async function fileToBase64(file) {
  console.log(TAG, "Reading file:", file.name, file.size);
  return bytesToBase64(new Uint8Array(await file.arrayBuffer()));
}

// Image ko chhota karke webp base64 banata hai
function compressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      const data = c.toDataURL("image/webp", quality);
      const ext = data.startsWith("data:image/webp") ? "webp" : "png";
      console.log(TAG, "Image compressed:", file.name, w + "x" + h, ext);
      resolve({ b64: data.split(",")[1], ext });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Image load failed: " + file.name)); };
    img.src = url;
  });
}

// Naam se URL wali id banata hai (Heli Crash -> heli-crash)
function slugify(s) {
  return s.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40) || "app";
}

// Id pehle se ho to -2, -3 laga deta hai
function uniqueId(base, apps) {
  let id = base, n = 2;
  while (apps.some((a) => a.id === id)) id = base + "-" + n++;
  return id;
}

// GitHub se latest apps.json parhta hai
async function loadAppsJson() {
  try {
    const j = await gh(`/contents/apps.json?ref=${BRANCH}`);
    const data = JSON.parse(base64ToUtf8(j.content));
    console.log(TAG, "apps.json loaded:", (data.apps || []).length);
    return { apps: data.apps || [], exists: true };
  } catch (e) {
    if (e.status === 404) { console.log(TAG, "apps.json not found – new store"); return { apps: [], exists: false }; }
    throw e;
  }
}

// Saari files ek hi commit mein GitHub pe bhejta hai
async function commitFiles(files, deletes, message) {
  setBusy("Preparing…");
  const ref = await gh(`/git/ref/heads/${BRANCH}`);
  const baseSha = ref.object.sha;
  const baseCommit = await gh(`/git/commits/${baseSha}`);
  const tree = [];
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    setBusy(`Uploading ${i + 1}/${files.length}: ${f.path.split("/").pop()}${f.big ? " (large file, please wait…)" : ""}`);
    const blob = await gh("/git/blobs", { method: "POST", body: JSON.stringify({ content: f.content, encoding: f.encoding || "base64" }) });
    tree.push({ path: f.path, mode: "100644", type: "blob", sha: blob.sha });
  }
  const newPaths = new Set(files.map((f) => f.path));
  [...new Set(deletes)].filter((p) => p && !newPaths.has(p)).forEach((p) => tree.push({ path: p, mode: "100644", type: "blob", sha: null }));
  setBusy("Saving changes…");
  const newTree = await gh("/git/trees", { method: "POST", body: JSON.stringify({ base_tree: baseCommit.tree.sha, tree }) });
  const commit = await gh("/git/commits", { method: "POST", body: JSON.stringify({ message, tree: newTree.sha, parents: [baseSha] }) });
  await gh(`/git/refs/heads/${BRANCH}`, { method: "PATCH", body: JSON.stringify({ sha: commit.sha }) });
  console.log(TAG, "Committed:", commit.sha);
}

// apps.json ki file object banata hai
function appsJsonFile(apps) {
  return { path: "apps.json", content: utf8ToBase64(JSON.stringify({ apps }, null, 2)) };
}

// Token save karke GitHub connection check karta hai
async function saveToken() {
  const v = $("#tokenInput").value.trim();
  if (!v) { toast("Paste your token first"); return; }
  lsSet("nova_gh_token", v);
  $("#tokenInput").value = "";
  await checkToken();
  refreshList();
}

// Token sahi kaam kar raha hai ya nahi, check karta hai
async function checkToken() {
  const st = $("#tokenStatus");
  if (!getToken()) { st.className = "err"; st.textContent = "No token saved yet."; return false; }
  try {
    await gh("");
    st.className = "ok";
    st.textContent = `✓ Connected to ${OWNER}/${REPO}`;
    console.log(TAG, "Token OK");
    return true;
  } catch (e) {
    st.className = "err";
    st.textContent = "Token not working: " + e.message;
    return false;
  }
}

// Apps ki list GitHub se laa kar dikhata hai
async function refreshList() {
  const box = $("#appList");
  if (!getToken()) { box.innerHTML = '<p class="muted">Save your GitHub token above to load apps.</p>'; return; }
  box.innerHTML = '<p class="muted">Loading…</p>';
  try {
    remote = await loadAppsJson();
    renderList();
  } catch (e) {
    box.innerHTML = `<p class="err">${esc(e.message)}</p>`;
    console.error(TAG, "List failed", e);
  }
}

// Apps ki list ka HTML banata hai
function renderList() {
  const box = $("#appList");
  if (!remote.apps.length) { box.innerHTML = '<p class="muted">No apps yet. Click “+ Add new app”.</p>'; return; }
  box.innerHTML = remote.apps.map((a) => `<div class="row">
    <img src="${esc(rawUrl(a.icon))}" alt="">
    <div class="row-info"><b>${esc(a.name)}</b><span>v${esc(a.version)} · ${fmtSize(a.size)} · ${esc(a.category || "")}</span>
      <div>${a.featured ? '<em class="badge">Featured</em>' : ""}${a.hidden ? '<em class="badge gray">Hidden</em>' : ""}</div></div>
    <div class="row-btns">
      <button data-act="edit" data-id="${esc(a.id)}">Edit</button>
      <button data-act="toggle" data-id="${esc(a.id)}">${a.hidden ? "Show" : "Hide"}</button>
      <button data-act="reviews" data-id="${esc(a.id)}">Reviews</button>
      <button data-act="link" data-id="${esc(a.id)}">Copy link</button>
      <button data-act="delete" data-id="${esc(a.id)}" class="danger">Delete</button>
    </div></div>`).join("");
  box.querySelectorAll("button[data-act]").forEach((b) => b.onclick = () => onRowAction(b.dataset.act, b.dataset.id));
  console.log(TAG, "List rendered:", remote.apps.length);
}

// List ke buttons ka kaam karta hai
function onRowAction(act, id) {
  console.log(TAG, "Action:", act, id);
  const app = remote.apps.find((a) => a.id === id);
  if (!app) return;
  if (act === "edit") openForm(app);
  if (act === "toggle") toggleHidden(id);
  if (act === "reviews") openReviews(app);
  if (act === "delete") deleteApp(app);
  if (act === "link") navigator.clipboard.writeText(STORE_URL + "#/app/" + id).then(() => toast("Link copied!"));
}

// Add / Edit form kholta hai
function openForm(app) {
  editingId = app ? app.id : null;
  $("#appForm").reset();
  $("#formTitle").textContent = app ? "Edit: " + app.name : "Add new app";
  $("#fName").value = app?.name || "";
  $("#fCategory").value = app?.category || "Games";
  $("#fVersion").value = app?.version || "";
  $("#fDeveloper").value = app?.developer || "USA Developers";
  $("#fMinAndroid").value = app?.minAndroid || "";
  $("#fPackage").value = app?.packageName || "";
  $("#fShort").value = app?.shortDesc || "";
  $("#fDesc").value = app?.description || "";
  $("#fWhatsNew").value = app?.whatsNew || "";
  $("#fFeatured").checked = !!app?.featured;
  $("#iconHint").textContent = app ? "(leave empty to keep current)" : "(square PNG, required)";
  $("#apkHint").textContent = app ? "(only for a new version)" : "(required, max 95 MB)";
  $("#shotHint").textContent = app ? "(choosing new ones replaces all, max 8)" : "(up to 8)";
  $("#apkCur").textContent = app?.apkName ? "Current: " + app.apkName + " (" + fmtSize(app.size) + ")" : "";
  const ip = $("#iconPrev");
  if (app?.icon) { ip.src = rawUrl(app.icon); ip.classList.remove("hidden"); } else ip.classList.add("hidden");
  $("#shotPrev").innerHTML = (app?.screenshots || []).map((s) => `<img src="${esc(rawUrl(s))}" alt="">`).join("");
  $("#appForm").classList.remove("hidden");
  $("#appForm").scrollIntoView({ behavior: "smooth" });
  console.log(TAG, "Form opened:", editingId || "new");
}

// Form band karta hai
function closeForm() {
  $("#appForm").classList.add("hidden");
  editingId = null;
  console.log(TAG, "Form closed");
}

// Nayi chuni hui images ka preview dikhata hai
function previewFiles() {
  const icon = $("#fIcon").files[0];
  if (icon) { const ip = $("#iconPrev"); ip.src = URL.createObjectURL(icon); ip.classList.remove("hidden"); }
  const shots = [...$("#fShots").files];
  if (shots.length) $("#shotPrev").innerHTML = shots.map((f) => `<img src="${URL.createObjectURL(f)}" alt="">`).join("");
  console.log(TAG, "Preview updated");
}

// App ko GitHub pe save / publish karta hai
async function saveApp(e) {
  e.preventDefault();
  const name = $("#fName").value.trim();
  const version = $("#fVersion").value.trim();
  const iconFile = $("#fIcon").files[0];
  const apkFile = $("#fApk").files[0];
  const shotFiles = [...$("#fShots").files];
  if (!name || !version) { toast("Name and version are required"); return; }
  if (!editingId && (!iconFile || !apkFile)) { toast("A new app needs an icon and an APK"); return; }
  if (apkFile && apkFile.size > MAX_APK) { toast("APK is bigger than 95 MB – GitHub can't store it", 5000); return; }
  if (shotFiles.length > 8) { toast("Maximum 8 screenshots"); return; }

  try {
    setBusy("Loading latest data…");
    const data = await loadAppsJson();
    const apps = data.apps;
    const now = new Date().toISOString();
    let app = editingId ? apps.find((a) => a.id === editingId) : null;
    if (editingId && !app) throw new Error("App not found on GitHub – refresh the page");
    if (!app) { app = { id: uniqueId(slugify(name), apps), createdAt: now, changelog: [], screenshots: [], hidden: false }; apps.push(app); }

    const files = [], deletes = [];
    const folder = `apps/${app.id}/`;
    const stamp = Date.now();

    if (iconFile) {
      setBusy("Compressing icon…");
      const im = await compressImage(iconFile, 512, 0.92);
      const p = `${folder}icon-${stamp}.${im.ext}`;
      files.push({ path: p, content: im.b64 });
      if (app.icon) deletes.push(app.icon);
      app.icon = p;
    }
    if (shotFiles.length) {
      const paths = [];
      for (let i = 0; i < shotFiles.length; i++) {
        setBusy(`Compressing screenshot ${i + 1}/${shotFiles.length}…`);
        const im = await compressImage(shotFiles[i], 1600, 0.85);
        const p = `${folder}shot-${stamp}-${i + 1}.${im.ext}`;
        files.push({ path: p, content: im.b64 });
        paths.push(p);
      }
      (app.screenshots || []).forEach((p) => deletes.push(p));
      app.screenshots = paths;
    }
    if (apkFile) {
      setBusy("Reading APK…");
      const apkName = `${app.id}-v${version.replace(/[^\w.-]/g, "")}.apk`;
      const p = `apks/${apkName}`;
      files.push({ path: p, content: await fileToBase64(apkFile), big: true });
      if (app.apkPath) deletes.push(app.apkPath);
      app.apkPath = p;
      app.apkName = apkName;
      app.size = apkFile.size;
    }

    const whatsNew = $("#fWhatsNew").value.trim();
    const versionChanged = app.version !== version;
    Object.assign(app, {
      name, version,
      category: $("#fCategory").value,
      developer: $("#fDeveloper").value.trim() || "USA Developers",
      minAndroid: $("#fMinAndroid").value.trim(),
      packageName: $("#fPackage").value.trim(),
      shortDesc: $("#fShort").value.trim(),
      description: $("#fDesc").value.trim(),
      whatsNew,
      featured: $("#fFeatured").checked,
      updatedAt: now
    });
    app.changelog = app.changelog || [];
    if (versionChanged || !app.changelog.length) app.changelog.unshift({ version, date: now, notes: whatsNew });
    else app.changelog[0].notes = whatsNew;

    files.push(appsJsonFile(apps));
    if (!data.exists) files.push({ path: ".nojekyll", content: "", encoding: "utf-8" });

    await commitFiles(files, deletes, `${editingId ? "Update" : "Add"} ${app.name} v${app.version}`);
    remote = { apps, exists: true };
    doneBusy();
    closeForm();
    renderList();
    toast("Saved! The store will update in about 1 minute.", 5000);
  } catch (err) {
    doneBusy();
    console.error(TAG, "Save failed", err);
    toast("Save failed: " + err.message, 7000);
  }
}

// App ko store pe chhupata / dikhata hai
async function toggleHidden(id) {
  try {
    setBusy("Updating…");
    const data = await loadAppsJson();
    const app = data.apps.find((a) => a.id === id);
    if (!app) throw new Error("App not found");
    app.hidden = !app.hidden;
    await commitFiles([appsJsonFile(data.apps)], [], `${app.hidden ? "Hide" : "Show"} ${app.name}`);
    remote = data;
    doneBusy();
    renderList();
    toast(app.hidden ? "App hidden from store" : "App visible on store");
  } catch (e) {
    doneBusy();
    toast("Failed: " + e.message, 6000);
  }
}

// App aur uski saari files delete karta hai
async function deleteApp(app) {
  if (!confirm(`Delete "${app.name}"?\nAPK, icon and screenshots will be removed.`)) return;
  try {
    setBusy("Deleting…");
    const data = await loadAppsJson();
    const target = data.apps.find((a) => a.id === app.id);
    if (!target) throw new Error("App not found");
    const apps = data.apps.filter((a) => a.id !== app.id);
    const deletes = [target.icon, target.apkPath, ...(target.screenshots || [])];
    await commitFiles([appsJsonFile(apps)], deletes, `Delete ${target.name}`);
    try { await deleteDoc(doc(db, "stats", app.id)); } catch (e) { console.warn(TAG, "Stats delete skipped", e); }
    remote = { apps, exists: true };
    doneBusy();
    renderList();
    toast("App deleted");
  } catch (e) {
    doneBusy();
    toast("Delete failed: " + e.message, 6000);
  }
}

// App ke reviews ka popup kholta hai
async function openReviews(app) {
  $("#rvTitle").textContent = "Reviews – " + app.name;
  const box = $("#rvList");
  box.innerHTML = '<p class="muted">Loading…</p>';
  $("#rvModal").classList.remove("hidden");
  try {
    const snap = await getDocs(query(collection(db, "reviews"), where("appId", "==", app.id)));
    const list = [];
    snap.forEach((d) => list.push({ docId: d.id, ...d.data() }));
    list.sort((x, y) => (y.createdAt?.seconds || 0) - (x.createdAt?.seconds || 0));
    if (!list.length) { box.innerHTML = '<p class="muted">No reviews yet.</p>'; return; }
    box.innerHTML = list.map((r) => `<div class="rv-row"><div><b>${esc(r.name)}</b> <span class="stars">${"★".repeat(r.rating || 0)}</span><p>${esc(r.text || "")}</p></div>
      <button class="danger" data-doc="${esc(r.docId)}">Delete</button></div>`).join("");
    box.querySelectorAll("button[data-doc]").forEach((b) => b.onclick = () => deleteReview(b));
    console.log(TAG, "Reviews loaded:", list.length);
  } catch (e) {
    box.innerHTML = `<p class="err">${esc(e.message)}</p>`;
    console.error(TAG, "Reviews failed", e);
  }
}

// Ek review delete karta hai
async function deleteReview(btn) {
  if (!confirm("Delete this review?")) return;
  try {
    await deleteDoc(doc(db, "reviews", btn.dataset.doc));
    btn.closest(".rv-row").remove();
    toast("Review deleted");
  } catch (e) {
    console.error(TAG, "Review delete failed", e);
    toast("Delete failed – check your UID in Firestore rules", 5000);
  }
}

// Admin login karta hai
async function login(e) {
  e.preventDefault();
  $("#lErr").textContent = "";
  try {
    await signInWithEmailAndPassword(auth, $("#lEmail").value.trim(), $("#lPass").value);
    console.log(TAG, "Logged in");
  } catch (err) {
    console.error(TAG, "Login failed", err);
    $("#lErr").textContent = "Login failed: " + err.code;
  }
}

// Saare buttons aur forms ke events jorta hai
function bindEvents() {
  $("#loginForm").addEventListener("submit", login);
  $("#logoutBtn").onclick = () => signOut(auth);
  $("#tokenSave").onclick = saveToken;
  $("#uidCopy").onclick = () => navigator.clipboard.writeText($("#uidText").textContent).then(() => toast("UID copied"));
  $("#addBtn").onclick = () => openForm(null);
  $("#formCancel").onclick = closeForm;
  $("#appForm").addEventListener("submit", saveApp);
  $("#fIcon").addEventListener("change", previewFiles);
  $("#fShots").addEventListener("change", previewFiles);
  $("#rvClose").onclick = () => $("#rvModal").classList.add("hidden");
  window.addEventListener("beforeunload", (e) => { if (busy) { e.preventDefault(); e.returnValue = ""; } });
  console.log(TAG, "Events bound");
}

bindEvents();

// Login hai to panel, warna login screen dikhata hai
onAuthStateChanged(auth, async (user) => {
  console.log(TAG, "Auth state:", user ? user.uid : "logged out");
  $("#loginView").classList.toggle("hidden", !!user);
  $("#panel").classList.toggle("hidden", !user);
  $("#logoutBtn").classList.toggle("hidden", !user);
  if (!user) return;
  $("#uidText").textContent = user.uid;
  await checkToken();
  refreshList();
});
</script>
